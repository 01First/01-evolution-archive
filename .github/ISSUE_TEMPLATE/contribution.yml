name: 贡献登记
description: 登记一项 01 进化档案馆贡献（第一季）
title: "[贡献] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请阅读 [POINTS.md](https://github.com/01First/01-evolution-archive/blob/main/POINTS.md)。
        所有任务免费参与，不需要购买任何东西；请勿提交私钥、助记词或任何敏感信息。
  - type: dropdown
    id: category
    attributes:
      label: 贡献类型
      options:
        - 内容创作（meme / 短视频 / 文章 / 翻译）
        - 传播互动（引用转发 / 讨论 / Space / 周报）
        - 邀请新成员
        - 开发（代码 PR / Bug / 安全漏洞）
        - 设计（Logo / 海报 / UI / 动效）
        - 文档 / 教程
        - 社区管理
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: 作品链接
      description: 可直接访问的公开链接（X、GitHub、图床、文档等）
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 贡献说明
      description: 做了什么、为什么与 01 的“进化”主题相关、是否使用 AI 辅助
      placeholder: 简述贡献内容与工作量
    validations:
      required: true
  - type: input
    id: handle
    attributes:
      label: 社区账号
      description: X / Telegram / Discord 账号（用于核对与公示）
      placeholder: "@yourname"
    validations:
      required: true
  - type: checkboxes
    id: declaration
    attributes:
      label: 声明
      options:
        - label: 内容为本人原创，未抄袭、未刷量、未购买互动
          required: true
        - label: 我已阅读 POINTS.md，理解积分不可转让、不构成收益承诺
          required: true
